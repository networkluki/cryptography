name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test module and entry point
        run: |
          python -m networkluki_cipher show
          networkluki-cipher show-map

  distribution:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate metadata
        run: python -m twine check --strict dist/*
      - name: Verify installed wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import networkluki_cipher; print(networkluki_cipher.CIPHER)"
          networkluki-cipher show
