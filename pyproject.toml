[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "networkluki-cipher"
version = "0.1.0"
description = "Educational monoalphabetic substitution cipher library and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "NetworkLuki"}]
keywords = ["cipher", "substitution", "education", "cryptography", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Security :: Cryptography",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/networkluki/cryptography"
Repository = "https://github.com/networkluki/cryptography"
Issues = "https://github.com/networkluki/cryptography/issues"

[project.scripts]
networkluki-cipher = "networkluki_cipher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["networkluki_cipher*"]
namespaces = false
